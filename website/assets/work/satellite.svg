    <linearGradient id="top" x1="190" y1="140" x2="560" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1624"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <linearGradient id="sea" x1="250" y1="150" x2="520" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b7bff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2b7bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="441" cy="250" r="120" gradientUnits="userSpaceOnUse">
