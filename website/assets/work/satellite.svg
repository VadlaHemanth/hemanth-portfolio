<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="80 60 640 400" fill="none">
  <title>Satellite research: layered imagery and one candidate region</title>
  <desc>An original synthetic illustration, not a satellite image or a real incident. Three stacked image layers carry contour lines, and one irregular region on the top layer is outlined for a person to review. The outline is a lead, not evidence of a spill or of which vessel was involved.</desc>
