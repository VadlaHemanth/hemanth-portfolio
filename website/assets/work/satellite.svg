      <stop offset=".45" stop-color="#2b7bff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slick" cx="441" cy="252" r="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9cc6ff" stop-opacity=".32"/>
