name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript and content tests
        working-directory: website
        run: |
          npm run check
          npm test
      - name: Validate public deployment boundary
        run: node scripts/build-site.mjs
      - name: Portable portfolio workflow helper checks
        run: |
          node --test skills/signature-scroll-portfolio/scripts/motion-map.test.mjs
          python3 -B -m unittest discover -s skills/signature-scroll-portfolio/scripts -p 'test_*.py'
